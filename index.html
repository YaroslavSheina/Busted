<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BUSTED</title>
<!-- установка на экран «Домой»: полный экран в портрете, иконка из ключевого арта (docs/refs/hero-image.jpg) -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon-64.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#0c182c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BUSTED">
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="top">
    <div id="ghud"><div id="bar"><i id="barFill"></i><span id="barMarks"></span><b id="barCar"></b><em>🏁</em></div><div id="gscore">0</div><div id="cop"><i id="copFill"></i></div><div id="gflash"></div><div id="hud"></div></div>
    <div><button id="carBtn" class="pill dbg">🚗 авто</button><button id="levelBtn" class="pill dbg">🏁 уровень</button><button id="mapBtn" class="pill" aria-label="пауза"></button></div>
  </div>
  <div id="map" class="hide"></div>
  <!-- титры после финала: закрывают историю пролога, тап — на карту -->
  <div id="dcard" class="hide"></div>
  <div id="garage" class="hide"></div>
  <div id="pause" class="hide"></div>
  <div id="settings" class="hide"></div>
  <div id="note" class="hide"></div>
  <div id="ending" class="hide"><div class="ebox"><h1>ГАРАЖ</h1><p id="endText"></p><small>нажми — на карту</small></div></div>
  <div id="panel" class="panel"></div>
  <div id="carPanel" class="panel"></div>
  <div class="zone" id="left">LEFT<span class="hand hide" id="handL"></span></div><div class="zone" id="right">RIGHT<span class="hand hide" id="handR"></span></div>
  <div id="overlay"><div id="ovName"></div><h1 id="ovTitle"></h1><div id="ovBody"></div><p id="ovSub"></p><small id="ovHint">нажми, чтобы повторить</small></div>
</div>
<!-- загрузочный экран: ключевой арт (docs/refs/hero-image.jpg), название, полоса загрузки; тап — в игру -->
<div id="splash"><div class="brand"><h1>BUSTED</h1><div class="bar"><i></i></div><small>нажми, чтобы начать</small></div><em id="build"></em></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
