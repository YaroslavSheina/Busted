<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Редактор уровней — Left / Right</title>
</head>
<body>
<div id="editor">
  <canvas id="ec"></canvas>
  <div id="epanel">
    <h2>Редактор уровней <button id="toggle" title="свернуть">▾</button></h2>
    <div class="body">
      <div class="row"><label>Открыть</label><select id="open"></select></div>
      <div class="row"><label>Название</label><input id="name" type="text"></div>
      <div class="row"><label>Ширина дороги</label><input id="width" type="range"><span id="widthV"></span></div>
      <div class="row"><label>Плотность трафика</label><input id="traffic" type="range"><span id="trafficV"></span></div>
      <div class="row"><label>Встречных полос<br><small>слева, 0 — односторонняя</small></label><input id="oncoming" type="number" min="0" max="2" step="1"></div>
      <div class="row"><label>Машина</label><select id="car"></select></div>
      <div class="row"><label>Seed</label><input id="seed" type="number" step="1"></div>
      <div class="row"><label>Ставить машины<br><small>или Shift+клик по дороге</small></label><input id="carMode" type="checkbox"></div>
      <div id="carBox" class="carBox" hidden>
        <div id="carInfo"></div>
        <div class="row"><label>Скорость, px/с<br><small>0 — стоит</small></label><input id="carSpeed" type="number" min="0" step="10"></div>
        <div class="row"><label>Грузовик-рампа<br><small>заезд сзади — прыжок</small></label><input id="carRamp" type="checkbox"></div>
        <button id="carDelete">Удалить машину</button>
      </div>
      <div class="row"><label>Преследователь<br><small>полиция на хвосте</small></label><input id="chaser" type="checkbox"></div>
      <div id="chaserBox" class="carBox" hidden>
        <div class="row"><label>Дистанция, px</label><input id="chaserGap" type="number" min="60" step="10"></div>
        <div class="row"><label>Скорость, ×игрока</label><input id="chaserSpeed" type="number" min="0.5" step="0.01"></div>
      </div>
      <div class="row"><label>Паника трафика<br><small>шанс при проезде впритирку, 0 — выкл</small></label><input id="panic" type="number" min="0" max="1" step="0.05"></div>
      <div class="row"><label>Навигатор<br><small>линия к гаражу по главной</small></label><input id="nav" type="checkbox"></div>
      <div class="row"><label>Длинные машины<br><small>доля автобусов и грузовиков, 0 — только легковые</small></label><input id="mix" type="number" min="0" max="0.5" step="0.05"></div>
      <div class="row"><label>Заграждение<br><small>на s, px от старта</small></label><select id="blockType"><option value="gap">пост с просветом</option><option value="full">перекрытие + обочина</option><option value="spikes">машина + ежи</option><option value="works">ремонт дороги</option></select></div>
      <div class="row"><label></label><input id="blockS" type="number" step="10" placeholder="s"><button id="blockAdd" class="mini">+</button></div>
      <div id="blockList"></div>
      <div class="row"><label>Ветка<br><small>от s до s по дороге-родителю</small></label><select id="branchOn"><option value="-1">от главной</option></select><input id="branchFrom" type="number" step="10" placeholder="от"><input id="branchTo" type="number" step="10" placeholder="до"><button id="branchAdd" class="mini">+</button></div>
      <div id="branchList"></div>
      <div class="row"><label>Сужение<br><small>от s, до s, ширина</small></label><input id="narrowFrom" type="number" step="10" placeholder="от"><input id="narrowTo" type="number" step="10" placeholder="до"><input id="narrowW" type="number" step="10" placeholder="px"><button id="narrowAdd" class="mini">+</button></div>
      <div id="narrowList"></div>
      <div class="row"><label>Переезд<br><small>s, период с, скорость</small></label><input id="railS" type="number" step="10" placeholder="s"><input id="railPeriod" type="number" step="0.5" placeholder="с"><input id="railSpeed" type="number" step="10" placeholder="px/с"><button id="railAdd" class="mini">+</button></div>
      <div id="railList"></div>
      <div class="row"><label>Перекрёсток<br><small>s, период с, красный в с</small></label><input id="crossS" type="number" step="10" placeholder="s"><input id="crossPeriod" type="number" step="0.5" placeholder="с"><input id="crossOffset" type="number" step="0.5" placeholder="с"><button id="crossAdd" class="mini">+</button></div>
      <div id="crossList"></div>
      <div id="stats"></div>
      <div class="buttons"><button id="export">Экспорт</button><button id="import">Импорт</button><button id="play" class="primary">Играть</button></div>
      <input id="file" type="file" accept=".json,application/json" hidden>
      <div id="status" class="hint"></div>
      <div id="cursor" class="hint"></div>
      <div class="hint">Клик по пустому месту — точка в конец. Перетаскивание — сдвиг. Delete или долгое нажатие — удалить. Shift+клик по дороге — машина в ближайшую полосу. Колесо или пинч — зум, тянуть пустое место — панорама.</div>
    </div>
  </div>
</div>
<div id="play-view" hidden>
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="top"><div id="hud"></div><button id="back">← редактор</button></div>
    <div class="zone" id="left">LEFT</div><div class="zone" id="right">RIGHT</div>
    <div id="overlay"><h1 id="ovTitle"></h1><p id="ovSub"></p><small id="ovHint">нажми, чтобы повторить</small></div>
  </div>
</div>
<script type="module" src="/src/editor/main.ts"></script>
</body>
</html>
